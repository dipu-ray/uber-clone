<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character Encoding & Browser Compatibility -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO Metadata -->
    <title>Earn Money by Driving or Get a Ride Now | Uber Bangladesh</title>
    <meta name="description"
        content="Book rides, request deliveries, and explore transit options online. A frontend HTML, CSS, and Tailwind CSS practice project mimicking the ultimate ride-hailing and logistics experience.">
    <meta name="keywords"
        content="Uber Clone, HTML CSS project, Tailwind CSS, ride-sharing UI, frontend development, responsive web design, portfolio project, taxi booking template">
    <meta name="author" content="Dipu Ray">
    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/images/icon.png" type="image/x-icon">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- Google "Inter" Font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- External CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

        <!-- Navbar -->
        <nav class="bg-black text-white py-4">
            <div class="container mx-auto px-5 2xl:px-30 flex justify-between items-center">
                <div class="flex items-center gap-6">
                    <div>
                        <a href="#x" class="text-lg lg:text-2xl">Uber</a>
                    </div>
                    <div>
                        <ul class="flex gap-1">
                            <li><a href="#x"
                                    class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Ride</a>
                            </li>
                            <li><a href="#x"
                                    class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Earn</a>
                            </li>
                            <li><a href="#x"
                                    class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Business</a>
                            </li>
                            <li><a href="#x"
                                    class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Uber
                                    Eats</a></li>
                            <li><a href="#x"
                                    class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">About
                                    <i class="fa-solid fa-angle-down ms-1"></i></a></li>
                        </ul>
                    </div>
                </div>
                <div>
                    <ul class="flex gap-1">
                        <li><a href="#x"
                                class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block"><i
                                    class="fa-solid fa-globe"></i> <span class="ms-1">EN</span></a></li>
                        <li><a href="#x"
                                class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Help</a>
                        </li>
                        <li><a href="#x"
                                class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full block">Log
                                in</a></li>
                        <li><a href="#x"
                                class="bg-white text-black hover:bg-white/90 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full block">Sign
                                up</a></li>
                        <li><a href="#x" class="ms-2 block lg:hidden mt-2"><i class="fa-solid fa-bars"></i></a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Hero or Home Section -->
        <section class="my-[60px]">
            <div class="flex gap-41 container mx-auto px-5 2xl:px-45">
                <div>
                    <a href="#x">
                        <i class="fa-solid fa-location-dot text-sm"></i>
                        <span class="font-medium me-1">Dhaka, BD</span>
                        <span class="underline">Change city</span>
                    </a>
                    <h1 class="text-[2.2rem] sm:text-[3.2rem] font-bold text-base/10 sm:text-base/16 mt-2 mb-7">Go anywhere with Uber</h1>
                    <a href="#x"
                        class="bg-black/6 px-4 py-[14px] rounded-full font-medium hover:bg-black/10 duration-100">
                        <i class="fa-solid fa-clock text-lg"></i>
                        <span>Pickup now</span>
                        <i class="fa-solid fa-angle-down"></i>
                    </a>
                    <div class="relative">
                        <div class="flex flex-col mt-9 gap-[15px] t-inputs">
                            <div class="relative">
                                <div
                                    class="absolute left-[17px] top-5 flex items-center justify-center w-[15px] h-[15px] rounded-full border-[3px] border-black bg-black">
                                    <div class="w-1 h-1 rounded-full bg-white"></div>
                                </div>
                                <div class="relative">
                                    <input class="w-98 bg-black/6 ps-12 py-4 rounded-md" type="text"
                                        placeholder="Pickup location">
                                    <i class="fa-solid fa-location-arrow absolute right-44 top-5 text-lg h-l-arrow"></i>
                                </div>
                            </div>
                            <div class="absolute bg-black left-[24px] top-8 w-[.5px] h-[60px]"></div>
                            <div>
                                <div
                                    class="absolute left-[17px] bottom-[22px] flex items-center justify-centerw-[12px] h-[12px] border-[5px] border-black bg-black">
                                    <div class="w-1 h-1 bg-white"></div>
                                </div>
                                <input class="w-98 bg-black/6 ps-12 py-4 rounded-md" type="text"
                                    placeholder="Dropoff location">
                            </div>
                        </div>
                    </div>
                    <div class="mt-[16px] inline-flex items-center home-btn-container">
                        <a href="#x" class="bg-black text-white px-[23px] py-[12px] rounded-lg">See prices</a>
                        <div class="relative">
                            <a href="#x" class="ms-5 login-btn">Log in to see your recent activity</a>
                            <div class="absolute left-[20px] top-[26px] bg-black/20 w-61 h-[1px]"></div>
                        </div>
                    </div>
                </div>
                <div class="relative h-img-container">
                    <img class="w-115 rounded-md" src="assets/images/home.png" alt="A Luggage with some assets">
                    <div
                        class="absolute bottom-5 left-5 bg-white/20 backdrop-blur-xl text-white px-3 py-4 w-105 flex justify-between items-center rounded-xl">
                        <span>Ready to travel?</span>
                        <a href="#x"
                            class="bg-white text-black px-4 py-3 rounded-full font-medium duration-200 hover:bg-white/85">Schedule
                            ahead</a>
                    </div>
                </div>
            </div>
        </section>
    </header>
</body>

</html>
