<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO Metadata -->
    <title>Earn Money by Driving or Get a Ride Now | Uber Bangladesh</title>

        content="Book rides, request deliveries, and explore transit options online. A frontend HTML, CSS, and Tailwind CSS practice project mimicking the ultimate ride-hailing and logistics experience.">

<body>

                            <li><a href="#x" class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Ride</a></li>
                            <li><a href="#x" class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Earn</a></li>
                            <li><a href="#x" class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Business</a></li>
                            <li><a href="#x" class="hover:bg-white/10 duration-200 px-3 py-[8px] text-[.85rem] font-medium rounded-full hidden lg:block">Uber Eats</a></li>

                    <a href="#x">
